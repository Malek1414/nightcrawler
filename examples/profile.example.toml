# Nightcrawler user profile
#
# Copy to profile.toml in the project root (or point PROFILE_PATH at it) and
# fill it in. It stays on your machine; profile.toml is in .gitignore.
# Every field is optional. The more you fill in, the better the agent can
# decide what to look for and how to rank it.

# Anything else the agent should know, in plain words. (Top-level keys must
# come before the first [table] in TOML, so this sits here.)
notes = "Weekday evenings and weekends work best. Happy to volunteer at events to get in free."

[who]
name = "Alex"
role = "technical founder, pre-seed"
goals = [
  "raise a pre-seed round in the next 6 months",
  "find 3 paying pilot customers for an AI automation product",
  "meet other founders and potential co-founders",
]
interests = ["AI agents", "automation", "B2B SaaS", "startups"]
languages = ["English"]
avoid = ["crypto token launches", "paid 'pitch to investors' events that charge founders"]

[home]
city = "Berlin, Germany"
# Optional. Without lat/lon the city is geocoded via OpenStreetMap and the
# result cached in ~/.cache/nightcrawler/geocode.json.
# lat = 52.520
# lon = 13.405
currency = "EUR"

[budget]
max_fee = 50          # most you'd pay for a ticket or entry
max_total = 250       # most you'd spend all-in (fee + travel + a night)
max_travel_km = 800   # beyond this, items are flagged
online_ok = true

[travel]
# Rough cost model, tune to your reality. Round trip is computed from these.
ground_cost_per_km = 0.12   # train/bus/car per km, one way
flight_threshold_km = 700   # above this, assume a budget flight
flight_base = 80
flight_cost_per_km = 0.06
overnight_km = 250          # further than this adds one night
lodging_per_night = 60

[weights]
# How much each factor counts in the 0-100 score (any positive numbers).
payoff = 4
fit = 4
access = 5              # cheap and close beats expensive and far
investor_presence = 3   # rooms with people who deploy capital

